name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  notes:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          # Pull the top-most "## <version>" section out of CHANGELOG.md so each
          # release gets detailed notes instead of a generic one-liner.
          {
            echo 'body<<RELEASE_EOF'
            echo 'Download the installer for your platform from the **Assets** below. Desktop auto-updates are supported from v1.0.2 onward.'
            echo ''
            awk '/^## /{c++} c==1 && !/^## /{print} c==2{exit}' CHANGELOG.md
            echo ''
            echo '---'
            echo 'Full changelog: https://github.com/reeshavsinha/AutomataLab/blob/main/CHANGELOG.md'
            echo 'RELEASE_EOF'
          } >> "$GITHUB_OUTPUT"

  release:
    needs: notes
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Get version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
        shell: bash

      - name: Determine release channel
        id: channel
        shell: bash
        run: |
          # Default to a pre-release. Only publish as the latest/stable release when
          # the tagged commit is already on the default branch (main). This stops a
          # tag cut from a feature branch (e.g. feat/v2-pda) from hijacking the
          # auto-updater's /releases/latest pointer until it has been merged to main.
          channel=true
          if git fetch --no-tags origin main >/dev/null 2>&1; then
            if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD >/dev/null 2>&1; then
              channel=false
            fi
          fi
          echo "prerelease=$channel" >> "$GITHUB_OUTPUT"
          echo "Resolved prerelease=$channel for commit $GITHUB_SHA"

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v${{ env.PACKAGE_VERSION }}
          releaseName: 'AutomataLab v${{ env.PACKAGE_VERSION }}'
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ steps.channel.outputs.prerelease }}
          updaterJsonPreferNsis: true

  # tauri-action publishes the updater manifest as `latest.json`, but the app's
  # configured endpoint expects `updater.json`. Mirror it once all platforms are done.
  updater-manifest:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mirror latest.json as updater.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output updater.json
          gh release upload "$tag" updater.json --repo "$GITHUB_REPOSITORY" --clobber
