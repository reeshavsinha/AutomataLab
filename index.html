<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutomataLab — Visual Automata Simulator</title>
    <meta name="description" content="A comprehensive visual learning and simulation environment for DFA, NFA, and ε-NFA computational models. Design, execute, and inspect every computation step." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('automatalab-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      function isBenignReport(message) {
        var text = String(message || '').toLowerCase();
        return text.indexOf('resizeobserver') !== -1 ||
          text.indexOf('resize observer') !== -1 ||
          text === 'canceled' ||
          text === 'script error' ||
          text.indexOf('script error.') !== -1;
      }
      window.onerror = function(message, source, lineno, colno, error) {
        if (isBenignReport(message) || isBenignReport(error && error.message)) return true;
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.background = 'red';
        div.style.color = 'white';
        div.style.padding = '10px';
        div.style.zIndex = '9999';
        div.innerText = String(message) + ' at ' + String(source) + ':' + String(lineno);
        document.body.appendChild(div);
      };
      window.onunhandledrejection = function(event) {
        var reason = event.reason;
        var text = reason && reason.message ? reason.message : String(reason);
        if (isBenignReport(text)) return;
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '50px';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.background = 'orange';
        div.style.color = 'white';
        div.style.padding = '10px';
        div.style.zIndex = '9999';
        div.innerText = 'Unhandled Rejection: ' + text;
        document.body.appendChild(div);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
